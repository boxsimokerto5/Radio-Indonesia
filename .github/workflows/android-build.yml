name: Build Signed APK & AAB (Radio Indonesia)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Auto-Generate Keystore, Build Signed APK & AAB
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'RadioIndonesia2026!' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'RadioIndonesia2026!' }}
      KEY_ALIAS: upload

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36 & Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment (.env & .env.example)
        run: |
          if [ ! -f .env.example ]; then
            echo "GEMINI_API_KEY=your_api_key_here" > .env.example
          fi
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Restore or Generate Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore or Auto-Generate Release Signature Key (JKS)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Restoring release keystore from GitHub Secret KEYSTORE_BASE64..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
          elif [ -f "$KEYSTORE_PATH" ]; then
            echo "Using existing release keystore at $KEYSTORE_PATH..."
          elif [ -f "my-upload-key.jks.base64" ]; then
            echo "Decoding my-upload-key.jks.base64 into $KEYSTORE_PATH..."
            base64 --decode my-upload-key.jks.base64 > "$KEYSTORE_PATH"
          else
            echo "Generating new Release Signature Keystore ($KEYSTORE_PATH) automatically..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Radio Indonesia, OU=Suara Nusantara, O=GeckoCreator, L=Jakarta, ST=DKI Jakarta, C=ID"
          fi
          ls -lh "$KEYSTORE_PATH"

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build Signed Release AAB (Android App Bundle)
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Package Signed Outputs & Keystore Info
        run: |
          mkdir -p release-outputs
          cp app/build/outputs/apk/release/*.apk release-outputs/Radio-Indonesia-v1.0-release-signed.apk
          cp app/build/outputs/bundle/release/*.aab release-outputs/Radio-Indonesia-v1.0-release-signed.aab
          cp app/build/outputs/apk/debug/*.apk release-outputs/Radio-Indonesia-v1.0-debug.apk
          cp "$KEYSTORE_PATH" release-outputs/my-upload-key.jks
          base64 -w 0 "$KEYSTORE_PATH" > release-outputs/my-upload-key.jks.base64.txt
          keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > release-outputs/CERTIFICATE_FINGERPRINTS.txt || true
          cat <<EOF > release-outputs/SIGNATURE_KEY_INFO.txt
          ========================================================
          RADIO INDONESIA - INFORMASI SIGNATURE KEY (RELEASE)
          ========================================================
          Keystore File  : my-upload-key.jks
          Key Alias      : $KEY_ALIAS
          Store Password : $STORE_PASSWORD
          Key Password   : $KEY_PASSWORD
          Key Algorithm  : RSA 2048-bit (SHA384withRSA)
          Validity       : 10,000 Days (~27 Years)
          Distinguished  : CN=Radio Indonesia, OU=Suara Nusantara, O=GeckoCreator, L=Jakarta, ST=DKI Jakarta, C=ID
          ========================================================
          Simpan file my-upload-key.jks ini dengan aman untuk
          pembaruan (update) aplikasi di Google Play Console.
          EOF
          ls -lh release-outputs/

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Indonesia-Signed-APK
          path: release-outputs/Radio-Indonesia-v1.0-release-signed.apk
          if-no-files-found: error

      - name: Upload Signed Release AAB (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Indonesia-Signed-AAB
          path: release-outputs/Radio-Indonesia-v1.0-release-signed.aab
          if-no-files-found: error

      - name: Upload Signature Keystore & Certificate Info
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Indonesia-Signature-Key-Bundle
          path: |
            release-outputs/my-upload-key.jks
            release-outputs/my-upload-key.jks.base64.txt
            release-outputs/SIGNATURE_KEY_INFO.txt
            release-outputs/CERTIFICATE_FINGERPRINTS.txt
          if-no-files-found: error
